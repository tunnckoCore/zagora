name: release
on:
  workflow_run:
    workflows:
      - ci # Name of the source workflow
    types:
      - completed

permissions:
  contents: read # for checkout

jobs:
  build-and-release:
    name: Build and Release through Bun
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 'latest'

      - name: Compute cache keys
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            HASH_CMD="shasum -a 256"
          else
            HASH_CMD="sha256sum"
          fi
          HASH_BUNLOCK=$($HASH_CMD bun.lock | awk '{print $1}')
          echo "HASH_BUNLOCK=$HASH_BUNLOCK" >> $GITHUB_ENV

      - name: Cache ~/.bun/install
        id: cache-bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install
          key: ${{ runner.os }}-bun-${{ env.HASH_BUNLOCK }}-v1
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.HASH_BUNLOCK }}-

      - run: bun install -g npm

      - name: Install dependencies
        shell: bash
        id: install
        run: bun install --frozen-lockfile
        continue-on-error: false

      - name: Verify the attestations and signatures
        run: npm audit signatures

      # no need for `bun run build` because npm publishing trigger prepublishOnly,
      # which in turn would trigger `bun run release` thus lint, tests, coverage badge, and build
      - name: Semantic Release from Bun
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bunx semantic-release@24 --dry-run

